@let s = stats();

<div class="stats">
  <div class="stat">
    <span class="value">{{ fmtInt(s?.lotes) }}</span>
    <span class="label">Lotes</span>
  </div>

  <div class="stat">
    <span class="value">{{ fmtInt(s?.manzanas) }}</span>
    <span class="label">Manzanas</span>
  </div>

  <div class="stat">
    <span class="value">{{ fmtInt(s?.con_area_m2) }}</span>
    <span class="label">Con área</span>
    <span class="bar"><i [style.width.%]="ratio(s?.con_area_m2)"></i></span>
  </div>

  <div class="stat">
    <span class="value">{{ fmtInt(s?.con_numero) }}</span>
    <span class="label">Con número</span>
    <span class="bar"><i [style.width.%]="ratio(s?.con_numero)"></i></span>
  </div>

  <div class="stat">
    <span class="value">{{ fmtInt(s?.con_frente) }}</span>
    <span class="label">Con frente</span>
    <span class="bar"><i [style.width.%]="ratio(s?.con_frente)"></i></span>
  </div>

  <button type="button" class="stat recovered" (click)="filterRecuperados.emit()" title="Ver lotes recuperados">
    <span class="value">{{ fmtInt(s?.recuperados) }}</span>
    <span class="label">Recuperados</span>
    <span class="bar"><i class="indigo" [style.width.%]="ratio(s?.recuperados)"></i></span>
  </button>

  <button type="button" class="stat review" (click)="openReview.emit()">
    <span class="value">{{ fmtInt(s?.review_pending) }}</span>
    <span class="label">Revisión pendiente</span>
    <span class="dot"></span>
  </button>

  <button type="button" class="audit-btn" (click)="openAudit.emit()" title="Panel de auditoría de calidad">
    <span>◔</span> Auditoría
  </button>
</div>

<div class="breakdown">
  @for (n of numStatus(); track n.key) {
    <button type="button" class="seg" [style.--c]="n.color">
      <i></i>
      <span class="v">{{ fmtInt(n.value) }}</span>
      <span class="l">{{ n.label }}</span>
    </button>
  }
</div>
